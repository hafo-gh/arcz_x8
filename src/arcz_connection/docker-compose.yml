name: arcz-connection

services:
  arcz_connection:
    build:
      context: .
      args:
        ROS_DISTRO: ${ROS_DISTRO:-jazzy}
    image: ${ARCZ_CONNECTION_IMAGE:-arcz/arcz_connection:latest}
    restart: unless-stopped
    network_mode: host
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      RMW_IMPLEMENTATION: rmw_zenoh_cpp
      ZENOH_SESSION_CONFIG_URI: /opt/ros/${ROS_DISTRO:-jazzy}/share/rmw_zenoh_cpp/config/DEFAULT_RMW_ZENOH_SESSION_CONFIG.json5
      PYTHONUNBUFFERED: "1"
    # The FC serial link. Adjust to match the actual device on this vehicle.
    devices:
      - ${PX4_SERIAL_DEVICE:-/dev/ttyACM0}:${PX4_SERIAL_DEVICE:-/dev/ttyACM0}
