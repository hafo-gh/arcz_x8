name: arcz-connection

services:
  arcz_connection:
    build:
      context: .
      args:
        ROS_DISTRO: ${ROS_DISTRO:-jazzy}
    image: ${ARCZ_CONNECTION_IMAGE:-arcz/arcz_connection:latest}
    restart: unless-stopped
    network_mode: host
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      RMW_IMPLEMENTATION: rmw_zenoh_cpp
      ZENOH_SESSION_CONFIG_URI: /opt/ros/${ROS_DISTRO:-jazzy}/share/rmw_zenoh_cpp/config/DEFAULT_RMW_ZENOH_SESSION_CONFIG.json5
      PYTHONUNBUFFERED: "1"
    # The FC serial link. Adjust PX4_SERIAL_DEVICE/PX4_SERIAL_BAUD in the
    # root .env to match this vehicle -- no need to edit launch/*.py.
    devices:
      - ${PX4_SERIAL_DEVICE:-/dev/ttyACM0}:${PX4_SERIAL_DEVICE:-/dev/ttyACM0}
    command:
      - ros2
      - launch
      - arcz_connection
      - connection.launch.py
      - serial_device:=${PX4_SERIAL_DEVICE:-/dev/ttyACM0}
      - serial_baud:=${PX4_SERIAL_BAUD:-921600}
