name: arcz-postflight

services:
  arcz_postflight:
    build:
      context: .
      args:
        ROS_DISTRO: ${ROS_DISTRO:-jazzy}
    image: ${ARCZ_POSTFLIGHT_IMAGE:-arcz/arcz_postflight:latest}
    restart: unless-stopped
    network_mode: host
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      RMW_IMPLEMENTATION: rmw_zenoh_cpp
      ZENOH_SESSION_CONFIG_URI: /opt/ros/${ROS_DISTRO:-jazzy}/share/rmw_zenoh_cpp/config/DEFAULT_RMW_ZENOH_SESSION_CONFIG.json5
      PYTHONUNBUFFERED: "1"
      VEHICLE_ID: ${VEHICLE_ID:?Set VEHICLE_ID in .env}
      MRBLACK_HOST: ${MRBLACK_HOST:-mrblack:8000}
      MALP_UPLOAD_TOKEN: ${MALP_UPLOAD_TOKEN:?Set MALP_UPLOAD_TOKEN in .env}
    volumes:
      - ${POSTFLIGHT_DATA_DIR:-./data}:/data
      # arcz_observability's mcap_recorder output, for the mcap_recording
      # collection source. Read-write: the uploader deletes the matched
      # flight's recording here once its upload is confirmed.
      - ${MCAP_LOGS_DIR:-../arcz_observability/mcap_logs}:/mcap_logs
      # Docker generates its own resolv.conf even under host networking,
      # replacing the host's systemd-resolved stub (127.0.0.53, which
      # understands Tailscale MagicDNS names like 'mrblack') with public
      # fallbacks that don't. Bind-mount the real one since networking is
      # already fully shared with the host in this mode.
      - /etc/resolv.conf:/etc/resolv.conf:ro
