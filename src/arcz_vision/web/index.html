<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080b0d">
  <title>SIYI Flight Camera</title>
  <link rel="stylesheet" href="/styles.css">
  <script defer src="/reader.js"></script>
  <script defer src="/app.js"></script>
</head>
<body>
  <main>
    <video id="camera" autoplay muted playsinline disablepictureinpicture></video>
    <div class="shade"></div>
    <header>
      <div class="identity"><span class="mark">ARCZ_KLEKANICE_0</span></div>
      <div id="stream-state" class="state waiting"><span class="dot"></span><span>CONNECTING</span></div>
    </header>
    <section id="message" class="message">
      <strong>Connecting to camera</strong>
      <span>Waiting for the WebRTC stream…</span>
    </section>
    <section class="controls" aria-label="Gimbal controls">
      <div class="control-group joystick-group">
        <div class="control-label"><span>PAN / TILT AND ZOOM</span><span>DRAG OR ARROWS</span></div>
        <div id="joystick" class="joystick" role="application" aria-label="Pan and tilt joystick">
          <span class="axis horizontal"></span><span class="axis vertical"></span>
          <span id="joystick-knob" class="joystick-knob"></span>
        </div>
        <div class="joystick-tools">
          <button class="hold-button" data-zoom="-1" type="button" aria-label="Zoom out" title="Zoom out (Page Down)">PgDown</button>
          <span class="zoom-caption">ZOOM</span>
          <button class="hold-button" data-zoom="1" type="button" aria-label="Zoom in" title="Zoom in (Page Up)">PgUp</button>
        </div>
        <div class="sub-label"><span>GIMBAL MODE</span><span id="gimbal-link">LINK —</span></div>
        <div class="mode-buttons">
          <button data-mode="lock" data-shortcut="l" type="button"><u>L</u>OCK</button>
          <button data-mode="follow" data-shortcut="f" type="button"><u>F</u>OLLOW</button>
          <button data-mode="fpv" data-shortcut="p" type="button">F<u>P</u>V</button>
        </div>
        <div class="gimbal-actions">
          <button id="center-gimbal" class="center-button" data-shortcut="c" type="button"><u>C</u>ENTER</button>
          <button id="auto-focus" class="focus-button" data-shortcut="a" type="button"><u>A</u>UTO FOCUS</button>
        </div>
      </div>
      <div class="control-group capture-group">
        <div class="control-label"><span>CAMERA</span><span id="record-state">RECORD —</span></div>
        <div class="capture-buttons">
          <button data-capture="start" type="button">START RECORDING</button>
          <button data-capture="stop" type="button">STOP RECORDING</button>
          <button data-capture="photo" type="button">TAKE PHOTO</button>
        </div>
      </div>
    </section>
    <footer>
      <div class="telemetry">
        <span id="camera-health">CAMERA —</span>
        <span id="network-health">TAILSCALE —</span>
        <span id="viewer-count">VIEWERS —</span>
      </div>
      <button id="fullscreen" type="button" aria-label="Toggle fullscreen">FULLSCREEN</button>
    </footer>
  </main>
</body>
</html>
