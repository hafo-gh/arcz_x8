name: arcz-vision

services:
  arcz_vision:
    build:
      context: .
      args:
        ROS_DISTRO: ${ROS_DISTRO:-jazzy}
    image: ${ARCZ_VISION_IMAGE:-arcz/arcz_vision:latest}
    restart: unless-stopped
    # Host networking: the ZR-10 camera lives on the Jetson's own ethernet
    # subnet (10.42.0.10), and Tailscale serve proxies to 127.0.0.1:8080.
    network_mode: host
    environment:
      PYTHONUNBUFFERED: "1"
